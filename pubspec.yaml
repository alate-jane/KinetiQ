name: kinetiq
description: "KinetiQ - AI-powered fitness coach with real-time pose detection, form correction and automatic rep counting"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # AI - Workout Planning
  google_generative_ai: ^0.4.6

  # Local Storage
  shared_preferences: ^2.3.3

  # Animations
  lottie: ^3.3.1

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
